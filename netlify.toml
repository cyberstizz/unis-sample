# Netlify configuration
[build]
  command = "npm run build"
  publish = "dist"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache HTML (so users get updates)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Browsers only talk to unismusic.com over HTTPS for the next year.
    Strict-Transport-Security = "max-age=31536000"
    # Unis never uses the camera or microphone; turning them off means an
    # injected script couldn't either.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    # Enforced now: no other site may frame Unis (clickjacking), no plugins,
    # and no rewriting of the page's base URL.
    Content-Security-Policy = "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
    # The full policy, in REPORT-ONLY mode: browsers don't block anything yet,
    # they only report what WOULD be blocked to the backend (Railway logs show
    # "[CSP]" lines). Once a few days pass with no unexpected lines, it gets
    # enforced, and from then on only Unis's own code (plus Stripe's) can run
    # on the page. That is what stops an injected script from stealing a
    # sign-in token.
    #   Hosts: cdn.unismusic.com = songs/photos (R2), the Railway address =
    #   the API and live messages, Stripe/Link = the support payment form,
    #   nominatim = city lookup at sign-up, Google Fonts + unpkg (map styles).
    #   A staging copy with its own API address must add that address to
    #   connect-src on its own branch.
    # To enforce: delete the narrow Content-Security-Policy line above, then
    # rename Content-Security-Policy-Report-Only below to Content-Security-Policy.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' https://js.stripe.com https://*.js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://cdn.unismusic.com https://*.stripe.com https://*.link.com; media-src 'self' blob: https://cdn.unismusic.com; connect-src 'self' https://unismvp-production.up.railway.app wss://unismvp-production.up.railway.app https://cdn.unismusic.com https://nominatim.openstreetmap.org https://api.stripe.com https://link.com https://*.link.com; frame-src https://js.stripe.com https://*.js.stripe.com https://hooks.stripe.com https://link.com https://*.link.com; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; report-uri https://unismvp-production.up.railway.app/api/csp-report"