<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- PWA & Mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#163387" />
    <meta name="msapplication-TileColor" content="#163387" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Unis" />
    <meta name="description" content="Discover, vote, and support music from your neighborhood." />

    <!-- Icons -->
    <link rel="icon" type="image/x-icon" href="/favicons/logo-blue.ico" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicons/logo-blue.ico" />
    <link rel="apple-touch-icon" href="/favicons/logo-blue.ico" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Fonts: every Google font the app uses, in one stylesheet the browser
         finds straight away. (Leaflet's map stylesheet used to load here too;
         the map is src/map/UnisMap.jsx now and never used it.)
         Adding a font: add its family and weights to this link. vite.config.js
         removes the matching @import lines from the style files at build time. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;family=Instrument+Serif:ital@0;1&amp;family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&amp;family=Caveat:wght@700&amp;family=Playfair+Display:ital,wght@0,700;1,700&amp;family=Bitcount+Grid+Double&amp;display=swap"
    />

    <title>UNIS</title>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

    <!-- The service worker is registered in src/main.jsx (no inline scripts:
         the Content-Security-Policy forbids them). -->
  </body>
</html>
