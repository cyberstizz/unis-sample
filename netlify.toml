# Netlify configuration
[build]
  command = "npm run build"
  publish = "dist"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache HTML (so users get updates)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Browsers only talk to unismusic.com over HTTPS for the next year.
    Strict-Transport-Security = "max-age=31536000"
    # Unis never uses the camera or microphone; turning them off means an
    # injected script couldn't either.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    # Content Security Policy, ENFORCED since Oct 22 2026.
    # Only Unis's own code, plus Stripe's, can run on the page, which is what
    # stops an injected script from stealing a sign-in token. It also blocks
    # framing by other sites, plugins, and rewriting the page's base URL.
    # Anything blocked is still reported to the backend (Railway logs show
    # "[CSP]" lines), so check those after any change that adds a new outside
    # service, and add its address to the right list below.
    #   Hosts: cdn.unismusic.com = songs/photos (R2), pub-fdce...r2.dev =
    #   the same R2 storage under its older address (songs and photos
    #   uploaded before the cdn address, still stored that way in the
    #   database), static.cloudflareinsights.com + cloudflareinsights.com =
    #   Cloudflare Web Analytics (Cloudflare adds its script to the page),
    #   the Railway address =
    #   the API and live messages, Stripe/Link = payment forms, nominatim =
    #   address lookup (sign-up, waitlist), Google Fonts + unpkg (map styles),
    #   googlesyndication / doubleclick / adtrafficquality / google.com =
    #   Google AdSense in the ad spaces (only loaded once VITE_ADSENSE_CLIENT
    #   is set).
    #   BEFORE TURNING ADSENSE ON: Google only supports AdSense under an
    #   enforced policy that uses a per-page nonce (its ad addresses change),
    #   so this moves to a nonce-based policy (a small Netlify edge function)
    #   first. Ads can be blocked under this list.
    #   public/sw.js leaves every outside file to the browser; if it ever
    #   fetches one itself, that address must be in connect-src too.
    #   A staging copy with its own API address must add that address to
    #   connect-src on its own branch.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com https://js.stripe.com https://*.js.stripe.com https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.adtrafficquality.google https://fundingchoicesmessages.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://cdn.unismusic.com https://pub-fdce5bcbb7b14f3ead9299d58be5fbe6.r2.dev https://*.stripe.com https://*.link.com https://*.googlesyndication.com https://*.g.doubleclick.net https://*.google.com https://*.adtrafficquality.google; media-src 'self' blob: https://cdn.unismusic.com https://pub-fdce5bcbb7b14f3ead9299d58be5fbe6.r2.dev; connect-src 'self' https://unismvp-production.up.railway.app wss://unismvp-production.up.railway.app https://cdn.unismusic.com https://pub-fdce5bcbb7b14f3ead9299d58be5fbe6.r2.dev https://cloudflareinsights.com https://nominatim.openstreetmap.org https://api.stripe.com https://link.com https://*.link.com https://*.googlesyndication.com https://*.g.doubleclick.net https://*.google.com https://*.adtrafficquality.google https://fundingchoicesmessages.google.com; frame-src https://js.stripe.com https://*.js.stripe.com https://hooks.stripe.com https://link.com https://*.link.com https://*.googlesyndication.com https://*.g.doubleclick.net https://www.google.com https://*.adtrafficquality.google https://fundingchoicesmessages.google.com; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; report-uri https://unismvp-production.up.railway.app/api/csp-report"